# Default configuration. Every key can be overridden from the CLI with
#   android-automation run "..." -s agent.max_steps=50 -s model.temperature=0.2
#
# Defaults target a single 12-16 GB GPU running Holo3.1-4B behind vLLM:
#   vllm serve Hcompany/Holo-3.1-4B --max-model-len 32768 --limit-mm-per-prompt '{"image": 3, "video": 0}'
# (see README for other models and hardware).

model:
  backend: openai                     # openai (any /v1/chat/completions server) | transformers (in-process)
  model: Hcompany/Holo-3.1-4B
  base_url: http://localhost:8000/v1
  api_key_env: VLM_API_KEY            # env var holding the key; vLLM ignores it
  temperature: 0.0
  max_tokens: 1024
  structured_output: json_schema      # json_schema | json_object | none
  # Holo/Qwen family models answer in 0..1000 coordinates. Use `pixel` for
  # Qwen2.5-VL based models (Holo1.5, UI-TARS-1.5), `normalized_1` for 0..1.
  coordinate_space: normalized_1000
  # Passed to the chat template. Holo2/Holo3 templates read `thinking`, Qwen3.5 reads
  # `enable_thinking`; keys a template does not use are ignored. Thinking off = faster
  # steps (the JSON already has a "thought" field). Remove for hosted APIs.
  chat_template_kwargs:
    thinking: false
    enable_thinking: false
  image:
    factor: 32                        # patch_size * merge_size of the vision encoder
    min_pixels: 65536
    max_pixels: 1605632               # ~1.6 MP: a 1080x2400 screen goes in as 832x1888
    format: JPEG

# Optional planner/grounder split: a second model only turns element descriptions
# into coordinates. See configs/planner_grounder.yaml.
grounder: null

device:
  serial: null                        # needed when several devices are attached (`adb devices`)
  adb_path: adb
  text_input: auto                    # auto | input | adbkeyboard (non-ASCII text needs ADBKeyboard)

agent:
  max_steps: 30
  history_images: 1                   # screenshots per prompt (1 = current only)
  history_actions: 12
  max_parse_retries: 2
  settle_seconds: 1.0
  stable_timeout: 3.0
  change_threshold: 0.001             # fraction of the screen that must change to count as an effect
  stuck_threshold: 3
  record_dir: runs                    # null to disable run recording

# Extra app name -> package aliases for `open_app` (common apps are built in).
apps:
  quran: com.quran.labs.androidquran
